apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: observability
data:
  petclinic-alerts.yml: |
    groups:
      - name: petclinic-alerts
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "{{ $labels.job }} has been unreachable for more than 1 minute."

          - alert: HighErrorRate
            expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate on {{ $labels.job }}"
              description: "{{ $labels.job }} 5xx error rate is above 5% for 5 minutes."

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High p95 latency on {{ $labels.job }}"
              description: "{{ $labels.job }} p95 latency exceeds 500ms for 5 minutes."

          - alert: PodRestartLoop
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is restart-looping"
              description: "{{ $labels.pod }} in {{ $labels.namespace }} restarted more than 3 times in 15 minutes."

          - alert: HighMemoryUsage
            expr: container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage in {{ $labels.pod }}"
              description: "{{ $labels.pod }} memory usage is above 80% of its limit for 5 minutes."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alert-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: observability
data:
  rules.yml: |
    groups:
      - name: petclinic-log-alerts
        rules:
          - alert: LogErrorSpike
            expr: rate({namespace=~"petclinic-.*"} |= "ERROR" [5m]) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Error log spike in petclinic namespaces"
              description: "Error log rate exceeds 0.5/s across petclinic namespaces for 5 minutes."

          - alert: JVMOutOfMemory
            expr: count_over_time({namespace=~"petclinic-.*"} |= "OutOfMemoryError" [5m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "OutOfMemoryError detected in petclinic"
              description: "A JVM OutOfMemoryError was logged in the petclinic namespaces."
